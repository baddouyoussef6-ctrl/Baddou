name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v6

      - name: إعداد Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: تجهيز مشروع أندرويد وبناء APK
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --project-name my_app --platforms android .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          flutter pub get
          flutter build apk --release

      - name: رفع ملف APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false
